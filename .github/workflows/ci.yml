name: CI

on:
  pull_request:
    paths-ignore:
      - 'bucket/**'
      - 'Formula/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'bucket/**'
      - 'Formula/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-s -w -X main.version=ci" -o cli-GPT-6.1-Sol-go${{ runner.os == 'Windows' && '.exe' || '' }} .
